[project]
name = "research-classifier"
version = "0.1.0"
description = "Classify bank research emails with an LLM and browse them in a dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "pypdf",
    "pydantic>=2",
    "litellm",
    "python-dotenv",
    "httpx>=0.28.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# prompt text is prose sent to the model; one paragraph per line keeps prompt diffs readable
"pipeline/prompt.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
